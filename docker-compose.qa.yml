# RanchOS QA stack for atlas.
# Usage (from repo root on atlas):
#   docker compose --env-file .env.qa -f docker-compose.qa.yml up -d --build
name: ranchos-qa

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 5432 is taken on the host (Infisical); expose QA Postgres on 5433.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Internal to the QA network only (no host port published).

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_BASE_URL}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_BASE_URL}
      NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}
    ports:
      - "3001:3001"

volumes:
  pgdata:
